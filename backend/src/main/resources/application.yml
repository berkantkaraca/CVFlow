spring:
  application:
    name: cvflow-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/cv_saas
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.5-flash
      base-url: https://generativelanguage.googleapis.com
  pdf:
    gotenberg:
      base-url: ${PDF_GOTENBERG_URL:http://localhost:3000}
