services:
  postgres:
    image: postgres:17
    container_name: cvflow-postgres
    environment:
      POSTGRES_DB: cv_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: cvflow-gotenberg
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
    ports:
      - "3000:3000"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: cvflow-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cv_saas
      PDF_GOTENBERG_URL: http://gotenberg:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - postgres
      - gotenberg
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cvflow-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
